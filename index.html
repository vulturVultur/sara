<!doctype html>
<html lang="fr">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sara Pizzeraya Kebap — Kebab · Pizza · Grill · Shisha Bar</title>

    <!-- Aperçu au partage (WhatsApp, Facebook, Instagram, Messenger) : c'est

         TODO au déploiement : passer og:image en URL absolue (https://…/img/hero.jpg),
         certains robots ne résolvent pas les chemins relatifs. -->
    <meta property="og:type" content="restaurant" />
    <meta property="og:site_name" content="Sara Pizzeraya Kebap" />
    <meta property="og:title" content="Sara Pizzeraya Kebap — Kebab · Pizza · Grill · Shisha Bar" />

    <meta property="og:image" content="/img/hero.jpg" />
    <meta property="og:locale" content="fr_CH" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
